  - id: M-000
    title: "Inbox / Triage"
    status: in-progress
    description: "Triage queue for new or unplanned work."
  - id: M-001
    title: "LLM Research Lifecycle v1"
    status: in-progress
    description: "Establish governance contracts and an executable baseline for LLM-driven research lifecycle workflows."

features:
  - id: F-000
    title: "Inbox / Untriaged"
    status: in-progress
    description: "Untriaged tasks live here until mapped to a real feature."
    milestone_id: M-000
  - id: F-001
    title: "Research Lifecycle Governance Core"
    status: in-progress
    description: "Deliver Stage DAG + Value Gate governance with versioned lifecycle execution for M1-M8 modules."
    milestone_id: M-001
  - id: F-002
    title: "Desktop Frontend Foundation"
    status: in-progress
    description: "Build Electron desktop shell with React/Vite renderer and brand-aligned UI theme system."
    milestone_id: M-001

requirements:
  - id: R-001
    title: "M4-M8 version spine and gate execution baseline"
    status: in-progress
    description: "Implement minimal backend/API/persistence baseline aligned with governance contracts for versioned research lifecycle progression."
    feature_id: F-001
  - id: R-002
    title: "Electron desktop scaffold and brand UI landing"
    status: in-progress
    description: "Deliver desktop app baseline, style theme integration, and task packaging for frontend development."
    feature_id: F-002
  - id: R-003
    title: "External automated-research borrowing adaptation baseline"
    status: in-progress
    description: "Translate external automated research system mechanisms into governance-ready adaptation docs and incremental interface deltas."
    feature_id: F-001
  - id: R-004
    title: "Desktop governance observability panels baseline"
    status: planned
    description: "Deliver desktop timeline/metrics/artifact/release-review panels that consume governance delta contracts with feature-flagged rollout."
    feature_id: F-002
  - id: R-005
    title: "Governance read API and release review gate baseline"
    status: planned
    description: "Implement governance read APIs, release review endpoint, and incremental events with compatibility constraints."
    feature_id: F-001
  - id: R-006
    title: "Governance event delivery mechanism baseline"
    status: planned
    description: "Define and stage event delivery policy (in-process/durable-outbox), idempotency, retry/dlq, and observability contracts without changing existing governance semantics."
    feature_id: F-001
  - id: R-007
    title: "Governance event delivery backend implementation baseline"
    status: planned
    description: "Implement backend event delivery adapter, in-process retry path, and durable-outbox compatible execution boundaries."
    feature_id: F-001
  - id: R-008
    title: "Governance event delivery observability and ops baseline"
    status: planned
    description: "Define delivery telemetry, alerting policy, replay approval flow, and incident runbook for governance event delivery."
    feature_id: F-001
  - id: R-009
    title: "Automated topic management decision layer baseline"
    status: planned
    description: "Define and stage the topic-to-paper decision layer with reviewer-aligned need/question/value/promotion artifacts and MVP implementation boundaries."
    feature_id: F-001
  - id: R-010
    title: "Desktop legacy CSS retirement and governance freeze"
    status: in-progress
    description: "Freeze the desktop renderer legacy CSS layer as compatibility-only, govern its retirement waves, and prevent new feature work from extending it."
    feature_id: F-002
  - id: R-011
    title: "Research argument control plane baseline"
    status: in-progress
    description: "Define and stage the pre-writing research-argument workspace, readiness state, bridge flow, control plane, and phased planner/critic enhancement between title-cards and paper-projects."
    feature_id: F-001
  - id: R-012
    title: "Experiment foundation reusable assets baseline"
    status: planned
    description: "Define and stage a reusable experiment foundation for dataset, benchmark, baseline, evaluation protocol, and run recipe assets that support implementation-stage reuse."
    feature_id: F-001

