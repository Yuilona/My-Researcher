version: 1

templates:
  - prompt_template_id: literature-key-content-section
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Extract source-grounded key-content items from one fulltext section.
    variables_schema:
      type: object
      required: [title, source_refs, section_text]
      properties:
        title:
          type: string
        source_refs:
          type: array
        section_text:
          type: string
    notes:
      - Output only exact ref_type and bare ref_id values from provided source_refs.
      - Do not cite bibliography prose, labels, or concatenated source-ref descriptions.

  - prompt_template_id: literature-key-content-consolidation
    version: 2
    runtime_profile_id: literature_key_content_v2
    description: Consolidate section-level key-content items into a paper-level dossier.
    variables_schema:
      type: object
      required: [title, source_refs, categories]
      properties:
        title:
          type: string
        source_refs:
          type: array
        categories:
          type: object
    notes:
      - Preserve source_refs already present on section-level items.
      - Do not invent source refs during consolidation.

  - prompt_template_id: literature-auto-pull-quality
    version: 1
    runtime_profile_id: auto_pull_quality.v1
    description: Score a candidate paper for literature intake quality.
    variables_schema:
      type: object
      required: [title, provider, ranking_signals]
      properties:
        title:
          type: string
        provider:
          type: string
        ranking_signals:
          type: object
    notes:
      - Return a single quality_score number from 0 to 100.

  - prompt_template_id: topic-selection-research-slice-planning
    version: 1
    runtime_profile_id: topic_selection_research_slice_planning.v1
    description: Generate source-grounded, constraint-bounded ResearchSlice options for v1b topic selection.
    variables_schema:
      type: object
      required: [planning_input_json]
      properties:
        planning_input_json:
          type: object
    notes:
      - Return only JSON matching the ResearchSlice option-set schema.
      - Do not introduce unmet needs beyond the provided ValidatedNeed and evidence refs.
      - Every option must cite copied refs from the supplied planning input.
      - Every option must include claim_ceiling_alignment; exceeds is not selectable and uncertain requires review.

  - prompt_template_id: topic-selection-topic-question-formation
    version: 1
    runtime_profile_id: topic_selection_topic_question_formation.v1
    description: Generate source-grounded, answerability-checked TopicQuestion candidates for v1b topic selection.
    variables_schema:
      type: object
      required: [topic_question_formation_input_json]
      properties:
        topic_question_formation_input_json:
          type: object
    notes:
      - Return only JSON matching the TopicQuestion candidate-set schema.
      - Copy ValidatedNeed, ResearchSlice boundary, assumption, and evidence refs from the supplied v1b handoff.
      - Do not introduce new unmet-need proof, new evidence authority, value assessment, package, promotion, or PaperProject objects.
      - Each admissible candidate must include an answerability plan, claim ceiling fit, excluded claims, allowed refinements, and falsification conditions.

  - prompt_template_id: topic-selection-topic-value-assessment
    version: 1
    runtime_profile_id: topic_selection_topic_value_assessment.v1
    description: Assess v1b TopicQuestion value from the active question contract and selected ResearchSlice snapshot.
    variables_schema:
      type: object
      required: [topic_value_assessment_input_json, research_slice_snapshot_json]
      properties:
        topic_value_assessment_input_json:
          type: object
        research_slice_snapshot_json:
          type: object
    notes:
      - Return only JSON matching the TopicValueAssessment structured reasoning schema.
      - Cite only refs inherited from the T-059 value handoff and T-057 ResearchSlice snapshot.
      - Do not prove a new unmet need, create new evidence authority, rewrite the question, or expand the slice.
      - Do not create a TopicPackage, promotion decision, PaperProject, or package-readiness claim.
      - advance_to_package only means the draft-package handoff may be prepared by deterministic service logic.
