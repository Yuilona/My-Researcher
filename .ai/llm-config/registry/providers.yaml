version: 1

providers:
  - provider_id: openai
    display_name: OpenAI
    auth:
      type: api_key
      credential_ref_required: true
      credential_ref: literature_content_processing.openai
      env_fallback_key: OPENAI_API_KEY
    capabilities:
      - responses
      - embeddings
    defaults:
      timeout_ms: 60000
      max_retries: 1
      supports_streaming: false
  - provider_id: dashscope
    display_name: Alibaba Cloud Model Studio / DashScope
    auth:
      type: api_key
      credential_ref_required: true
      credential_ref: literature_content_processing.dashscope
      env_fallback_key: DASHSCOPE_API_KEY
    endpoints:
      openai_compatible_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    capabilities:
      - chat_completions
      - json_object
      - thinking
    defaults:
      timeout_ms: 120000
      max_retries: 1
      supports_streaming: false
