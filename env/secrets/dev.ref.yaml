version: 1
secrets:
  database_url:
    backend: mock
    ref: mock://dev/database_url
    hint: Local Prisma dev DB URL. Recommended schema is my_researcher_dev, for example postgresql://<local-os-user>@127.0.0.1:5432/postgres?schema=my_researcher_dev.
  openai_api_key:
    backend: envfile
    ref: "envfile:.env.local#OPENAI_API_KEY"
    hint: Local OpenAI API key stored in gitignored .env.local.
  dashscope_api_key:
    backend: envfile
    ref: "envfile:.env.local#DASHSCOPE_API_KEY"
    hint: Local DashScope API key stored in gitignored .env.local.
  dashscope_api_key_coding:
    backend: envfile
    ref: "envfile:.env.local#DASHSCOPE_API_KEY_CODING"
    hint: Local DashScope coding API key stored in gitignored .env.local.
  deepseek_api_key:
    backend: envfile
    ref: "envfile:.env.local#DEEPSEEK_API_KEY"
    hint: Local DeepSeek API key stored in gitignored .env.local.
