version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.
  SERVICE_NAME:
    type: string
    required: true
    default: your-service
    description: Service name (logical).
  PORT:
    type: int
    required: true
    default: 8000
    description: Service listen port.
  HOST:
    type: string
    required: false
    default: 0.0.0.0
    description: Service listen host.
  DATABASE_URL:
    type: url
    required: true
    secret: true
    secret_ref: database_url
    scopes: [dev]
    description: Prisma database URL for the local development database.
  TITLE_CARD_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for title-card management and topic-selection authority stores.
  RESEARCH_LIFECYCLE_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for research lifecycle stores; cascades from TITLE_CARD_REPOSITORY when unset.
  AUTO_PULL_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for auto-pull stores; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  APPLICATION_SETTINGS_REPOSITORY:
    type: enum
    enum: [memory, prisma]
    required: false
    default: memory
    description: Repository strategy for application settings; must match TITLE_CARD_REPOSITORY when title-card uses Prisma.
  AUTO_PULL_SCHEDULER_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'true'
    description: Enable the auto-pull background scheduler.
  LITERATURE_USER_AUTH_PIPELINE_ENABLED:
    type: enum
    enum: ['true', 'false']
    required: false
    default: 'false'
    description: Enable deep pipeline stages for USER_AUTH literature rights class.
  LITERATURE_PIPELINE_EMBEDDING_URL:
    type: string
    required: false
    description: Optional external embedding endpoint; unset means local fallback embedding.
  LITERATURE_PIPELINE_EMBEDDING_API_KEY:
    type: string
    required: false
    description: Optional API key for external embedding endpoint.
  LITERATURE_PIPELINE_EMBEDDING_MODEL:
    type: string
    required: false
    default: text-embedding-v1
    description: Embedding model name used when external embedding endpoint is configured.
